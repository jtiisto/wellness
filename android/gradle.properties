org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Off on purpose (2026-10-29, per ../../conventions/android.md, Coverage): with it
# on, a daemon that reuses the entry without having configured the project
# in-process runs koverVerifyAggregated without the root report filters and
# fails the gate at a wrong, lower number (83.19 % here; share saw 93.14 %).
# The pre-push hook also passes --no-build-cache, because the build cache
# stores that wrong verdict and serves it back after clean.
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
