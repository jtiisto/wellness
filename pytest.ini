[pytest]
testpaths = test
asyncio_mode = auto
addopts = -v --tb=short
# A hung test fails by name after 5 minutes and dumps every thread's stack,
# instead of stalling the pre-push gate with no output (pytest-timeout).
timeout = 300
markers =
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests
